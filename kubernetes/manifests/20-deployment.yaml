apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: restapi-flask
  name: restapi-flask
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restapi-flask
  strategy: {}
  template:
    metadata:
      labels:
        app: restapi-flask
    spec:
      containers:
      - image: restapi-flask:latest
        name: restapi-flask
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000  # The port your application listens on inside the container
          name: http
        env:
        - name: FLASK_ENV
          value: development
        envFrom:
        - secretRef:
            name: mongodb-credentials
        resources: {}
        livenessProbe:
          httpGet: 
            path: /health
            port: 5000
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
status: {}