name: Deploy App

on:
  push:
    branches:
      - main

  wirkflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: | 
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Run tests
        run: make test
